schema_version: "1.0"
workflow:
  id: clarity-validate
  name: Validate the clarity foundation
  version: 1.1.0
  scope: repo
  description: >
    Validates the clarity foundation and records the verdict; on PASS, publishes it to
    .compose/memory/, commits on the clarity branch and fast-forwards the default branch.
steps:
  - id: validate
    command: clarity-validate
    engine_options:
      # the body-hash command from the clarity manifest, which headless steps must run
      allowed_tools: ["Bash(awk:*)", "Bash(git hash-object:*)"]
  - id: verdict
    type: clarity
    action: record-verdict
    from_step: validate

  - id: memory-check
    type: if
    # publish on every PASS: it costs nothing, writes nothing when nothing changed, and
    # picks up a compose upgrade that changes what is published
    condition: "{{ steps.verdict.output.result == 'PASS' }}"
    then:
      - id: memory
        name: Publish the memory files
        type: clarity
        action: publish-memory

  - id: commit
    type: clarity
    action: commit
  - id: merge
    type: clarity
    action: merge
