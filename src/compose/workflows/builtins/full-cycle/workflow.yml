schema_version: "1.0"
workflow:
  id: full-cycle
  name: Full spec cycle
  version: 1.3.0
  description: >
    Constitution (if missing), specify, optional clarify, human review of the spec,
    plan, human review of the plan, tasks, consistency analysis, implementation and convergence with the spec.
inputs:
  spec:
    type: string
    required: true
    prompt: Describe the feature
  feature_name:
    type: string
    description: Short name for a new feature (default derived from the spec).
  clarify:
    type: boolean
    default: false
    description: Run the clarify step after specify.
  review_spec_verdict:
    type: string
    default: ""
    description: Pre-answer the spec review gate (approve or reject).
  review_plan_verdict:
    type: string
    default: ""
    description: Pre-answer the plan review gate (approve or reject).
  allowed_tools:
    type: string
    default: ""
    description: >
      Extra tools implement may use without asking, comma-separated
      (e.g. "Bash(npm test),Bash(npm run lint)"). Needed for it to run your tests.
  converge:
    type: boolean
    default: true
    description: >
      After implement, check the code against the spec, plan and tasks and implement
      what is still missing (up to 3 rounds).
steps:
  - id: constitution-check
    type: if
    condition: "{{ not context.constitution_exists }}"
    then:
      - id: constitution
        command: compose-constitution
  - id: specify
    command: compose-specify
    input:
      args: "{{ inputs.spec }}"
  - id: clarify-check
    type: if
    condition: "{{ inputs.clarify }}"
    then:
      - id: clarify
        command: compose-clarify
  - id: review-spec
    type: gate
    message: "Review {{ context.feature.dir }}/spec.md before planning."
    verdict_input: review_spec_verdict
    options: [approve, reject]
    on_reject: abort
  - id: plan
    command: compose-plan
  - id: review-plan
    type: gate
    message: "Review {{ context.feature.dir }}/plan.md before tasks and implementation."
    verdict_input: review_plan_verdict
    options: [approve, reject]
    on_reject: abort
  - id: tasks
    command: compose-tasks
  - id: analyze
    command: compose-analyze
  - id: implement
    command: compose-implement
    engine_options:
      allowed_tools: ["{{ inputs.allowed_tools | split(',') }}"]
  - id: converge-check
    type: if
    condition: "{{ inputs.converge }}"
    then:
      - id: converge-loop
        type: do-while
        max_iterations: 3
        # repeat while tasks.md still has open tasks after converge (and implement),
        # unless implement changed no files: another round would find the same gaps
        condition: >-
          {{ steps.open-tasks.output.exit_code == 0
             and steps.implement-gaps.changes.files > 0 }}
        steps:
          - id: converge
            command: compose-converge
          - id: open-tasks
            type: shell
            run: grep -nE '^[[:space:]]*- \[ \]' "{{ context.feature.dir }}/tasks.md"
            capture: true
            continue_on_error: true
          - id: gaps-check
            type: if
            condition: "{{ steps.open-tasks.output.exit_code == 0 }}"
            then:
              - id: implement-gaps
                command: compose-implement
                input:
                  args: "the open tasks, starting with the latest Convergence phase"
                engine_options:
                  allowed_tools: ["{{ inputs.allowed_tools | split(',') }}"]
