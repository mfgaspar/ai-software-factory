schema_version: "1.0"
workflow:
  id: full-cycle
  name: Full spec cycle
  version: 1.0.0
  description: >
    Constitution (if missing), specify, optional clarify, human review of the spec,
    plan, human review of the plan, tasks, consistency analysis and implementation.
inputs:
  spec:
    type: string
    required: true
    prompt: Describe the feature
  feature_name:
    type: string
    description: Short name for a new feature (default derived from the spec).
  clarify:
    type: boolean
    default: false
    description: Run the clarify step after specify.
  review_spec_verdict:
    type: string
    default: ""
    description: Pre-answer the spec review gate (approve or reject).
  review_plan_verdict:
    type: string
    default: ""
    description: Pre-answer the plan review gate (approve or reject).
steps:
  - id: constitution-check
    type: if
    condition: "{{ not context.constitution_exists }}"
    then:
      - id: constitution
        command: compose-constitution
  - id: specify
    command: compose-specify
    input:
      args: "{{ inputs.spec }}"
  - id: clarify-check
    type: if
    condition: "{{ inputs.clarify }}"
    then:
      - id: clarify
        command: compose-clarify
  - id: review-spec
    type: gate
    message: "Review {{ context.feature.dir }}/spec.md before planning."
    verdict_input: review_spec_verdict
    options: [approve, reject]
    on_reject: abort
  - id: plan
    command: compose-plan
  - id: review-plan
    type: gate
    message: "Review {{ context.feature.dir }}/plan.md before tasks and implementation."
    verdict_input: review_plan_verdict
    options: [approve, reject]
    on_reject: abort
  - id: tasks
    command: compose-tasks
  - id: analyze
    command: compose-analyze
  - id: implement
    command: compose-implement
