schema_version: "1.0"
workflow:
  id: clarity
  name: Clarity foundation
  version: 1.1.0
  scope: repo
  description: >
    Drafts the clarity foundation from the sources, asks and applies the questions it
    raises (mixed mode, up to 4 rounds), publishes it to .compose/memory/, validates,
    commits on the clarity branch and, on PASS, fast-forwards the default branch.
inputs:
  sources:
    type: string
    default: ""
    description: Paths or URLs to draft from, space-separated, passed to /clarity as given.
  mode:
    type: string
    default: mixed
    enum: [mixed, auto]
    description: >
      mixed asks the pending questions and applies the answers; auto only drafts and
      leaves its questions in .clarity/questions.yml for later.
steps:
  - id: draft
    name: Draft the documents
    command: clarity
    input:
      args: "{{ inputs.sources }} draft"
    # drafting the whole foundation is the largest single step compose runs
    limits: {max_cost_usd: 25}
    engine_options:
      # the body-hash command from the clarity manifest, which headless steps must run
      allowed_tools: ["Bash(awk:*)", "Bash(git hash-object:*)"]

  - id: ask-check
    type: if
    condition: "{{ inputs.mode == 'mixed' }}"
    then:
      # repeat while questions other than approvals are pending after apply, up to 4 rounds
      - id: rounds
        type: do-while
        max_iterations: 4
        condition: "{{ steps.count.output.holding > 0 }}"
        steps:
          - id: questions
            name: Your answers
            type: questions
            file: .clarity/questions.yml
          - id: apply
            name: Apply your answers
            command: clarity
            input:
              args: apply
            limits: {max_cost_usd: 10}
            engine_options:
              allowed_tools: ["Bash(awk:*)", "Bash(git hash-object:*)"]
          - id: count
            quiet: true
            type: questions
            file: .clarity/questions.yml
            ask: false

  # copies the documents to .compose/memory/ and writes its index (no model call)
  - id: memory
    name: Publish the memory files
    type: clarity
    action: publish-memory

  - id: validate
    name: Validate the documents
    command: clarity-validate
    engine_options:
      # the body-hash command from the clarity manifest, which headless steps must run
      allowed_tools: ["Bash(awk:*)", "Bash(git hash-object:*)"]
  - id: verdict
    quiet: true
    type: clarity
    action: record-verdict
    from_step: validate

  - id: commit
    name: Commit on the clarity branch
    type: clarity
    action: commit
  - id: merge
    quiet: true
    type: clarity
    action: merge
