schema_version: "1.0"
workflow:
  id: bugfix
  name: Bug fix
  version: 2.1.0
  description: >
    Assess a bug report, review the assessment, then fix and test until the tests pass
    (up to 3 tries), and verify the fix.
inputs:
  report:
    type: string
    required: true
    prompt: Describe the bug (text or an issue URL)
  test_command:
    type: string
    required: true
    prompt: Command that runs the tests
  feature_name:
    type: string
    description: Short name for the bug's feature (default derived from the report).
  review_assessment_verdict:
    type: string
    default: ""
    description: Pre-answer the assessment review gate (approve or reject).
  allowed_tools:
    type: string
    default: ""
    description: >
      Extra tools the fix and verify steps may use without asking, comma-separated
      (e.g. "Bash(npm test)"). Tests always run in their own step regardless.
steps:
  - id: assess
    command: compose-bug-assess
    input:
      args: "{{ inputs.report }}"
  - id: review-assessment
    type: gate
    message: "Review {{ context.feature.dir }}/assessment.md before any code changes."
    verdict_input: review_assessment_verdict
    options: [approve, reject]
    on_reject: abort
  - id: fix-loop
    type: do-while
    max_iterations: 3
    # retry while the tests fail, unless the fix changed no files (the same tests would
    # fail the same way)
    condition: "{{ steps.test.output.exit_code != 0 and steps.fix.changes.files > 0 }}"
    steps:
      - id: fix
        command: compose-bug-fix
        input:
          args: |
            The tests run with: {{ inputs.test_command }}
            Output of the last test run, if any:
            {{ steps.test.output.stdout | default("(not run yet)") }}
            {{ steps.test.output.stderr | default("") }}
        engine_options:
          allowed_tools: ["{{ inputs.allowed_tools | split(',') }}"]
      - id: test
        type: shell
        strict: true
        env:
          TEST_COMMAND: "{{ inputs.test_command }}"
        run: sh -c "$TEST_COMMAND"
        capture: true
        continue_on_error: true
  - id: verify
    command: compose-bug-test
    input:
      args: >
        The test command is {{ inputs.test_command }}; its last run in this workflow exited
        with code {{ steps.test.output.exit_code }}.
    engine_options:
      allowed_tools: ["{{ inputs.allowed_tools | split(',') }}"]
