# Clarity manifest: the single source of truth for the clarity-* skills.
#
# Clarity holds the application-level why, rules and how. It never holds functional
# requirements, feature lists, screens or feature endpoints: those are "what", defined per
# feature by compose (compose-specify, then compose-plan), which follows these documents.
#
# Shipped with compose and refreshed on every install. Do not edit it in a project:
# customise through .clarity/config.yml, which is applied on top (the "effective manifest").
# Paths under `documents` are relative to .clarity/; templates are relative to this folder.

version: 1
protocol_dir: .clarity
templates_dir: .compose/templates/clarity
config: .clarity/config.yml
config_template: config.yml

# Body hash: the fingerprint of everything after a document's front matter. Every skill
# computes hashes with exactly this command, replacing FILE with the document's path.
hash_command: "awk 'n>=2; /^---$/ && n<2 {n++}' FILE | git hash-object --stdin"

# Text that marks a document as still a template. Any occurrence means "draft".
placeholder_markers:
  - "[To be determined"
  - "[TBD"
  - "[Write this like you're telling a friend"
  - "[Project Title]"
  - "No failure modes have been analyzed yet"
  - "No decisions have been recorded yet"

# A document with `mandatory: false` is optional: it is in the effective manifest only when
# .clarity/config.yml names it under `mandatory.add`. Otherwise it is not created, drafted
# or checked.

# Documents that can never be marked not applicable or removed from the mandatory set.
never_na:
  - goal/problem.md
  - goal/requirements.md

# Order in which documents are worked on and reported. Failures come before architecture,
# which breaks the failures <-> architecture dependency cycle (as in clarity-agent).
walk_order:
  - goal/problem.md
  - goal/stakeholders.md
  - goal/requirements.md
  - goal/open-questions.md
  - solution/solution.md
  - failures/failures.md
  - failures/fmea.md
  - solution/architecture.md
  - decisions/index.md
  - product/prd.md
  - product/ux-standards.md
  - contracts/api.md
  - data/data-model.md
  - ops/setup-guide.md
  - solution/solution-summary.md
  - summary.md

# Confirmation batches used by /clarity, in order. Each validated document is in exactly one.
stages:
  - name: goal
    documents: [goal/problem.md, goal/stakeholders.md, goal/requirements.md, goal/open-questions.md]
  - name: solution
    documents: [solution/solution.md]
  - name: failures
    documents: [failures/failures.md, failures/fmea.md]
  - name: architecture
    documents: [solution/architecture.md, decisions/index.md]
  - name: product
    documents: [product/prd.md, product/ux-standards.md]
  - name: technical
    documents: [contracts/api.md, data/data-model.md, ops/setup-guide.md]
  - name: summaries
    documents: [solution/solution-summary.md, summary.md]

# How to route an unresolved, blocking open question by its Strategy field.
question_strategies:
  prototyping: clarity-discovery-prototype
  research: clarity-discovery-research
  thinking: clarity-problem

documents:
  goal/problem.md:
    template: goal/problem.md
    mandatory: true
    allow_na: false
    required_sections: [Problem, Why This Matters, Scope, Success Criteria]
    depends_on: []
    produced_by: clarity-problem
    memory:
      summary: "The problem being solved, why it matters, what is in and out of scope, and the success criteria."
      read_at: [specify, clarify, analyze]
      read_when: ""

  goal/stakeholders.md:
    template: goal/stakeholders.md
    mandatory: true
    allow_na: true
    required_sections: [Stakeholders]
    depends_on: [goal/problem.md]
    produced_by: clarity-problem
    memory:
      summary: "Who uses the application, who is affected by it and who might misuse it."
      read_at: [specify, clarify, analyze]
      read_when: ""

  goal/requirements.md:
    template: goal/requirements.md
    mandatory: true
    allow_na: false
    required_sections: [Non-functional requirements, Constraints, Standards]
    depends_on: [goal/problem.md, goal/stakeholders.md]
    produced_by: clarity-problem
    memory:
      summary: "The rules every feature must meet: non-functional requirements (NFR), constraints (CON) and standards (STD)."
      read_at: [specify, clarify, plan, tasks, implement, analyze]
      read_when: ""

  goal/open-questions.md:
    template: goal/open-questions.md
    kind: questions          # unresolved questions with "Blocking: yes" make the project blocked
    mandatory: true
    allow_na: true
    required_sections: [Questions]
    depends_on: [goal/problem.md]
    produced_by: clarity-problem
    memory:
      summary: "Questions about the application that are still open, and whether each one blocks work."
      read_at: [analyze]
      read_when: "the feature touches an area an open question covers"

  solution/solution.md:
    template: solution/solution.md
    mandatory: true
    allow_na: true
    required_sections: [Approach, Why this approach, Alternatives considered, Risks and assumptions]
    depends_on: [goal/problem.md, goal/requirements.md, goal/open-questions.md]
    produced_by: clarity-solution
    memory:
      summary: "The chosen approach, why it was chosen, the alternatives set aside, and the risks and assumptions."
      read_at: [plan, analyze]
      read_when: ""

  failures/failures.md:
    template: failures/failures.md
    mandatory: true
    allow_na: true
    required_sections: [Failure modes, Cross-cutting patterns, Management plans]
    depends_on: [solution/solution.md, solution/architecture.md]
    produced_by: clarity-failure-analysis
    stage_skills: [clarity-failure-brainstorm, clarity-failure-analysis, clarity-failure-management]
    memory:
      summary: "Failure modes, the patterns across them, and the mitigations features must implement."
      read_at: [plan, tasks, analyze]
      read_when: ""

  # Optional: not part of a project unless .clarity/config.yml lists it under
  # `mandatory.add`. A worksheet generated from the failure documents, for projects that
  # must show an FMEA (regulated or safety-related work, audits).
  failures/fmea.md:
    template: failures/fmea.md
    mandatory: false
    allow_na: true
    required_sections: [Scope, Scales, Worksheet, Actions]
    depends_on: [failures/failures.md]
    produced_by: clarity-fmea
    memory:
      summary: "FMEA worksheet: each function's failure modes with effect, cause, current controls, severity and the recommended action."
      read_at: [analyze]
      read_when: "the feature changes a function listed in the worksheet"

  solution/architecture.md:
    template: solution/architecture.md
    mandatory: true
    allow_na: true
    required_sections: [Context, Components, Data flows, Deployment, Cross-cutting concerns, Threat model]
    depends_on: [solution/solution.md, failures/failures.md]
    produced_by: clarity-architecture
    memory:
      summary: "Components, data flows, deployment, cross-cutting concerns and the threat model."
      read_at: [plan, implement, analyze]
      read_when: ""

  decisions/index.md:
    template: decisions/index.md
    kind: decisions          # complete needs at least one ADR; proposed/reconsider ADRs block
    adr_template: decisions/adr.md
    adr_pattern: decisions/ADR-*.md
    mandatory: true
    allow_na: true
    required_sections: [Decisions]
    depends_on: []
    produced_by: clarity-decision
    memory:
      summary: "The list of architecture decisions (ADRs) and the status of each."
      read_at: [plan, analyze]
      read_when: ""

  product/prd.md:
    template: product/prd.md
    mandatory: true
    allow_na: true
    required_sections: [Overview, Users and personas, Goals and metrics, Scope boundaries, Product principles]
    depends_on: [goal/problem.md, goal/stakeholders.md, goal/requirements.md, solution/solution.md]
    produced_by: clarity-prd
    memory:
      summary: "Product overview, personas, goals and metrics (G), scope boundaries and product principles."
      read_at: [specify, clarify, analyze]
      read_when: ""

  product/ux-standards.md:
    template: product/ux-standards.md
    mandatory: true
    allow_na: true
    required_sections: [Surfaces and navigation, Interaction patterns, Accessibility and localization, Design system, State conventions]
    depends_on: [product/prd.md, goal/requirements.md]
    produced_by: clarity-ux-standards
    memory:
      summary: "UI rules: surfaces and navigation, interaction patterns, accessibility, design system and states."
      read_at: [analyze]
      read_when: "the feature has a user interface"

  contracts/api.md:
    template: contracts/api.md
    kind: contract           # optional front matter `spec:`; when set, an existing, well-formed spec file
    mandatory: true
    allow_na: true
    required_sections: [Overview, Authentication, Conventions, Errors, Versioning]
    depends_on: [solution/architecture.md, goal/requirements.md]
    produced_by: clarity-api-contracts
    memory:
      summary: "API conventions: authentication, naming, errors and versioning, and any published spec to keep."
      read_at: [analyze]
      read_when: "the feature adds, changes or calls an API"

  data/data-model.md:
    template: data/data-model.md
    mandatory: true
    allow_na: true
    required_sections: [Core entities, Entity relationship diagram, Data rules, Migrations, Retention]
    depends_on: [solution/architecture.md, goal/requirements.md]
    produced_by: clarity-data-model
    memory:
      summary: "Core entities and their relationships, data rules, migrations and retention."
      read_at: [analyze]
      read_when: "the feature stores, changes or reads persistent data"

  ops/setup-guide.md:
    template: ops/setup-guide.md
    mandatory: true
    allow_na: true
    required_sections: [Prerequisites, Environments, Local setup, Configuration, Secrets handling, Troubleshooting]
    depends_on: [solution/architecture.md, contracts/api.md, data/data-model.md]
    produced_by: clarity-setup-guide
    memory:
      summary: "Environments, local setup, configuration and how secrets are handled."
      read_at: [plan, tasks, analyze]
      read_when: ""

  solution/solution-summary.md:
    template: solution/solution-summary.md
    mandatory: true
    allow_na: true
    required_sections: [Summary]
    depends_on: [solution/solution.md, solution/architecture.md]
    produced_by: clarity-architecture
    memory:
      summary: "A one-page summary of the solution and its architecture."
      read_at: [analyze]
      read_when: "you need a quick overview before opening the full documents"

  summary.md:
    template: summary.md
    mandatory: true
    allow_na: true
    required_sections: []
    depends_on: [goal/problem.md, goal/stakeholders.md, solution/solution.md]
    produced_by: clarity-message
    memory:
      summary: "The project in a few sentences, as told to someone new."
      read_at: [analyze]
      read_when: "you need the project's purpose in brief"

# Publishing to .compose/memory/. After a clarity run, compose copies each document there
# (the body, unchanged) and writes .compose/memory/constitution.md: an index with one row
# per file saying what it holds and when a feature step reads it. Each document's `memory`
# block above feeds its row: `read_at` lists the steps that always open the file
# (specify, clarify, plan, tasks, implement, analyze) and `read_when` is a condition, in
# plain words, for the other steps. The entries below are the rows for files that aren't
# documents.
memory:
  adr:
    read_at: [analyze]
    read_when: "the feature touches this decision"
  feature_ideas:
    summary: "Feature ideas noted while the foundation was written. Suggestions, not rules."
    read_at: [specify]
    read_when: ""

# Created with the protocol folder but never validated.
companions:
  notes.md: notes.md
  observations.md: observations.md
  goal/resolved-questions.md: goal/resolved-questions.md
  questions.yml: questions.yml

# Templates skills copy when they need them (not documents on their own).
helpers:
  adr: decisions/adr.md
  failure_mode: failures/failure-mode.md
  thinker_output: failures/brainstorm/thinker.md
